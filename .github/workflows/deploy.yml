name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/reliable-cleaning-platform-4tbu9u
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Builds and validates the static export. Runs independently of GitHub Pages
  # being enabled, so this check reflects the health of the actual code.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        env:
          # Project site is served from /<repo>
          NEXT_PUBLIC_BASE_PATH: /reliableCleaning
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Publishes to GitHub Pages. Requires Pages to be enabled for the repo
  # (Settings → Pages → Source: GitHub Actions). On a free plan the repo must
  # be public.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
